[project]
name = "stockmock-backend"
version = "0.1.0"
description = "Indian F&O Strategy Builder & Option Simulator Backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "duckdb>=1.1.3",
    "fastapi>=0.115.6",
    "numpy>=2.1.3",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "scipy>=1.14.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
