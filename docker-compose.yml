services:
  postgres:
    image: postgres:16-alpine
    container_name: stockmock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockmock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmock_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stockmock}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockmock} -d ${POSTGRES_DB:-stockmock}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

